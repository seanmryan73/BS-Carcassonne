<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { display: block; margin: 8px 0; }
    a { display: inline-block; margin: 4px 0; padding: 8px 16px; background: #7d4e2d; color: white; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <h2>Icon Generator — open this file in a browser, then download the PNGs</h2>
  <p>Save <strong>icon-192.png</strong> and <strong>icon-512.png</strong> into the <code>icons/</code> folder.</p>
  <div id="out"></div>
  <script>
    function drawIcon(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const s = size / 192;

      // Background
      ctx.fillStyle = '#7d4e2d';
      const r = 36 * s;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'white';

      // Tower body
      roundRect(ctx, 44*s, 88*s, 104*s, 72*s, 4*s);

      // Battlements
      [[44,64],[72,64],[100,64],[128,64]].forEach(([x,y]) => {
        roundRect(ctx, x*s, y*s, 20*s, 32*s, 3*s);
      });

      // Gate (filled brown over white)
      ctx.fillStyle = '#7d4e2d';
      ctx.beginPath();
      ctx.moveTo(78*s, 160*s);
      ctx.lineTo(78*s, 130*s);
      ctx.quadraticCurveTo(78*s, 112*s, 96*s, 112*s);
      ctx.quadraticCurveTo(114*s, 112*s, 114*s, 130*s);
      ctx.lineTo(114*s, 160*s);
      ctx.closePath();
      ctx.fill();

      // Window
      roundRect(ctx, 80*s, 97*s, 32*s, 22*s, 3*s);

      return c;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    const out = document.getElementById('out');
    [192, 512].forEach(size => {
      const c = drawIcon(size);
      out.appendChild(c);
      const a = document.createElement('a');
      a.href = c.toDataURL('image/png');
      a.download = `icon-${size}.png`;
      a.textContent = `Download icon-${size}.png`;
      out.appendChild(a);
    });
  </script>
</body>
</html>
