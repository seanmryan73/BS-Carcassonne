<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>TillyTally</title>

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TillyTally">
  <meta name="theme-color" content="#7d4e2d">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <div id="dice-overlay" class="dice-overlay hidden">
    <div class="dice-scene">
      <p class="dice-label">Roll</p>
      <div class="dice-face" id="dice-face">
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
      </div>
      <div class="dice-actions">
        <button class="btn-primary dice-roll-again" id="dice-roll-again">Roll Again</button>
        <button class="btn-dice-done" id="dice-done">Done</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
