<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>TillyTally</title>

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TillyTally">
  <meta name="theme-color" content="#7d4e2d">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <div id="dice-overlay" class="dice-overlay hidden">
    <div class="dice-scene">
      <p class="dice-label">Roll</p>
      <div class="dice-cube-wrapper" id="dice-cube-wrapper">
        <div class="dice-cube" id="dice-cube">
          <div class="cube-face face-front"><!-- 1 -->
            <div class="cpip"></div><div class="cpip"></div><div class="cpip"></div>
            <div class="cpip"></div><div class="cpip show"></div><div class="cpip"></div>
            <div class="cpip"></div><div class="cpip"></div><div class="cpip"></div>
          </div>
          <div class="cube-face face-back"><!-- 1 -->
            <div class="cpip"></div><div class="cpip"></div><div class="cpip"></div>
            <div class="cpip"></div><div class="cpip show"></div><div class="cpip"></div>
            <div class="cpip"></div><div class="cpip"></div><div class="cpip"></div>
          </div>
          <div class="cube-face face-right"><!-- 2 -->
            <div class="cpip"></div><div class="cpip"></div><div class="cpip show"></div>
            <div class="cpip"></div><div class="cpip"></div><div class="cpip"></div>
            <div class="cpip show"></div><div class="cpip"></div><div class="cpip"></div>
          </div>
          <div class="cube-face face-left"><!-- 2 -->
            <div class="cpip"></div><div class="cpip"></div><div class="cpip show"></div>
            <div class="cpip"></div><div class="cpip"></div><div class="cpip"></div>
            <div class="cpip show"></div><div class="cpip"></div><div class="cpip"></div>
          </div>
          <div class="cube-face face-top"><!-- 3 -->
            <div class="cpip"></div><div class="cpip"></div><div class="cpip show"></div>
            <div class="cpip"></div><div class="cpip show"></div><div class="cpip"></div>
            <div class="cpip show"></div><div class="cpip"></div><div class="cpip"></div>
          </div>
          <div class="cube-face face-bottom"><!-- 3 -->
            <div class="cpip"></div><div class="cpip"></div><div class="cpip show"></div>
            <div class="cpip"></div><div class="cpip show"></div><div class="cpip"></div>
            <div class="cpip show"></div><div class="cpip"></div><div class="cpip"></div>
          </div>
        </div>
      </div>
      <div class="dice-actions">
        <button class="btn-primary dice-roll-again" id="dice-roll-again">Roll Again</button>
        <button class="btn-dice-done" id="dice-done">Done</button>
      </div>
    </div>
  </div>
  <div id="bridge-overlay" class="bridge-overlay hidden">
    <div class="bridge-scene" id="bridge-scene">
      <p class="bridge-label">Bridge Randomizer</p>
      <div class="bridge-slots-row">
        <div class="bridge-slot-col">
          <div class="bridge-slot-window" id="bridge-type-window">
            <div class="bridge-slot-fade-top"></div>
            <span class="bridge-slot-display" id="bridge-type-display">〰〰〰 Curvy</span>
            <div class="bridge-slot-win-line"></div>
            <div class="bridge-slot-fade-bot"></div>
          </div>
          <p class="bridge-slot-label">Bridge Type</p>
        </div>
        <div class="bridge-slot-divider">×</div>
        <div class="bridge-slot-col">
          <div class="bridge-slot-window bridge-slot-window--num" id="bridge-num-window">
            <div class="bridge-slot-fade-top"></div>
            <span class="bridge-slot-display bridge-slot-display--num" id="bridge-num-display">0</span>
            <div class="bridge-slot-win-line"></div>
            <div class="bridge-slot-fade-bot"></div>
          </div>
          <p class="bridge-slot-label">Count</p>
        </div>
      </div>
      <div class="bridge-actions">
        <button class="btn-primary bridge-roll-again" id="bridge-roll-again">Roll Again</button>
        <button class="btn-bridge-done" id="bridge-done">Done</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
